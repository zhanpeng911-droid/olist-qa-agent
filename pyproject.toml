[project]
name = "olist-engineering-agent"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pymysql>=1.1", "python-dotenv>=1.0", "uvicorn>=0.30", "httpx>=0.27", "sqlglot==28.10.1"]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engineering*", "server*", "agent_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
