[project]
name = "olist-qa-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.0.0",
    "pandas>=2.3.0",
    "pymysql>=1.2.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.1",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_core"]
py-modules = ["run"]
