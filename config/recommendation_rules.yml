# 建议规则库（recommendation_rules.yml）
# 来源：《低评分归因与改善建议Agent搭建思路》
# 用途：把"已验证风险因素"映射为"责任方/动作/监控指标/验证方式"。
# 原则：改善建议不由 LLM 自由发挥，由本规则库匹配 + 模型结合证据组织语言。

rules:
  - id: delay_1_3d
    condition: "延迟 1-3 天低评分风险明显上升"
    responsibility: 客服/物流
    actions:
      - "主动通知客户并更新预计到达时间(ETA)"
      - "开放自助查询，减少等待焦虑"
    monitor_metrics: ["延迟组低评分率", "客服联系成功率"]
    verify: "分批试点或 A/B 测试"

  - id: delay_overall
    condition: "延迟订单整体低评分风险显著上升，但样本不足以稳定区分延迟档位"
    responsibility: 物流/客服
    actions:
      - "监控预计送达日临近订单并提前通知"
      - "优先补齐全量数据后识别介入阈值"
    monitor_metrics: ["延迟率", "延迟订单低评分率", "延迟天数P90"]
    verify: "全量数据复核分档风险，再分线路试点"

  - id: delay_4d_plus
    condition: "延迟 4 天以上进入高风险区"
    responsibility: 客服/物流
    actions:
      - "人工介入与妥投核验"
      - "补发/退款/补偿策略"
    monitor_metrics: ["严重延迟率", "补偿后评分", "补偿成本"]
    verify: "按地区或线路做对照试点"

  - id: route_high_risk
    condition: "高规模高风险州际线路"
    responsibility: 物流
    actions:
      - "建立线路 SLA 与 P90 时效基线"
      - "旺季容量预警，复核承运商组合"
    monitor_metrics: ["线路延迟率", "P90 时效", "严重延迟数"]
    verify: "治理前后趋势 + 对照线路"

  - id: seller_late_handoff
    condition: "卖家晚交运与低评分/延迟稳定相关"
    responsibility: 卖家运营
    actions:
      - "临期提醒与备货检查"
      - "分层整改与激励"
    monitor_metrics: ["晚交运率", "最终延迟率", "低评分率"]
    verify: "分批上线预警规则"

  - id: multi_item_order
    condition: "多商品/多卖家订单风险偏高"
    responsibility: 产品/履约
    actions:
      - "分包进度展示与整单状态解释"
      - "错漏发核对流程"
    monitor_metrics: ["多商品订单低评分率", "咨询率"]
    verify: "功能灰度测试"

  - id: category_high_lowscore
    condition: "某品类低评分率偏高"
    responsibility: 品类运营
    actions:
      - "继续下钻 SKU、卖家和评价文本"
      - "检查包装、质量与描述一致性"
    monitor_metrics: ["品类低评分率", "退货原因"]
    verify: "补充文本/售后数据后验证"

# 通用输出约束：每条建议必须含"动作-责任方-指标-验证方式"，禁止泛化措辞
output_rule:
  format: "动作 — 责任方 — 监控指标 — 验证方式"
  forbid: ["加强物流管理", "提升卖家质量"]
